<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Section 11 - 产品表面纹理展示</title>
    <link rel="stylesheet" href="vendor/swiper/swiper-bundle.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<section id="section11">
    <div class="inner">

        <header class="head">
            <h2 class="title">Product Surface Texture Display</h2>
            <p class="desc">
                ABCDE® composite products are available in a wide range of surface textures
                to meet different design and application needs.
            </p>
        </header>

        <div class="layout">

            <div class="nav" role="tablist" aria-label="产品表面纹理">
                <button class="tab" type="button" role="tab" data-texture="c1">
                    Ultra Grain -- C1
                </button>

                <button class="tab" type="button" role="tab" data-texture="c2">
                    Ultra Grain -- C2
                </button>

                <button class="tab is-active" type="button" role="tab" data-texture="c3">
                    Ultra Grain -- C3
                </button>

                <button class="tab" type="button" role="tab" data-texture="brush">
                    Ultra Grain -- Brush
                </button>

                <button class="tab" type="button" role="tab" data-texture="e1">
                    Ultra Grain -- E1
                </button>

                <button class="tab" type="button" role="tab" data-texture="e2">
                    Ultra Grain -- E2
                </button>
            </div>

            <div class="viewer">

                <div class="texture swiper" aria-label="产品表面纹理图库">
                    <div class="swiper-wrapper"></div>
                </div>

                <button class="prev" type="button" aria-label="上一张图片">
                    <span aria-hidden="true">‹</span>
                </button>

                <button class="next" type="button" aria-label="下一张图片">
                    <span aria-hidden="true">›</span>
                </button>

                <div class="pagination swiper-pagination" aria-label="图库分页"></div>

            </div>

        </div>

        <div class="templates" hidden>

            <template data-texture="c1">
                <figure class="slide swiper-slide"><img src="images/c1-01.svg" alt="Ultra Grain C1 表面纹理 1"></figure>
                <figure class="slide swiper-slide"><img src="images/c1-02.svg" alt="Ultra Grain C1 表面纹理 2"></figure>
                <figure class="slide swiper-slide"><img src="images/c1-03.svg" alt="Ultra Grain C1 表面纹理 3"></figure>
                <figure class="slide swiper-slide"><img src="images/c1-04.svg" alt="Ultra Grain C1 表面纹理 4"></figure>
                <figure class="slide swiper-slide"><img src="images/c1-05.svg" alt="Ultra Grain C1 表面纹理 5"></figure>
                <figure class="slide swiper-slide"><img src="images/c1-06.svg" alt="Ultra Grain C1 表面纹理 6"></figure>
            </template>

            <template data-texture="c2">
                <figure class="slide swiper-slide"><img src="images/c2-01.svg" alt="Ultra Grain C2 表面纹理 1"></figure>
                <figure class="slide swiper-slide"><img src="images/c2-02.svg" alt="Ultra Grain C2 表面纹理 2"></figure>
                <figure class="slide swiper-slide"><img src="images/c2-03.svg" alt="Ultra Grain C2 表面纹理 3"></figure>
                <figure class="slide swiper-slide"><img src="images/c2-04.svg" alt="Ultra Grain C2 表面纹理 4"></figure>
                <figure class="slide swiper-slide"><img src="images/c2-05.svg" alt="Ultra Grain C2 表面纹理 5"></figure>
                <figure class="slide swiper-slide"><img src="images/c2-06.svg" alt="Ultra Grain C2 表面纹理 6"></figure>
            </template>

            <template data-texture="c3">
                <figure class="slide swiper-slide"><img src="images/c3-01.svg" alt="Ultra Grain C3 表面纹理 1"></figure>
                <figure class="slide swiper-slide"><img src="images/c3-02.svg" alt="Ultra Grain C3 表面纹理 2"></figure>
                <figure class="slide swiper-slide"><img src="images/c3-03.svg" alt="Ultra Grain C3 表面纹理 3"></figure>
                <figure class="slide swiper-slide"><img src="images/c3-04.svg" alt="Ultra Grain C3 表面纹理 4"></figure>
                <figure class="slide swiper-slide"><img src="images/c3-05.svg" alt="Ultra Grain C3 表面纹理 5"></figure>
                <figure class="slide swiper-slide"><img src="images/c3-06.svg" alt="Ultra Grain C3 表面纹理 6"></figure>
            </template>

            <template data-texture="brush">
                <figure class="slide swiper-slide"><img src="images/brush-01.svg" alt="Ultra Grain Brush 表面纹理 1"></figure>
                <figure class="slide swiper-slide"><img src="images/brush-02.svg" alt="Ultra Grain Brush 表面纹理 2"></figure>
                <figure class="slide swiper-slide"><img src="images/brush-03.svg" alt="Ultra Grain Brush 表面纹理 3"></figure>
                <figure class="slide swiper-slide"><img src="images/brush-04.svg" alt="Ultra Grain Brush 表面纹理 4"></figure>
                <figure class="slide swiper-slide"><img src="images/brush-05.svg" alt="Ultra Grain Brush 表面纹理 5"></figure>
                <figure class="slide swiper-slide"><img src="images/brush-06.svg" alt="Ultra Grain Brush 表面纹理 6"></figure>
            </template>

            <template data-texture="e1">
                <figure class="slide swiper-slide"><img src="images/e1-01.svg" alt="Ultra Grain E1 表面纹理 1"></figure>
                <figure class="slide swiper-slide"><img src="images/e1-02.svg" alt="Ultra Grain E1 表面纹理 2"></figure>
                <figure class="slide swiper-slide"><img src="images/e1-03.svg" alt="Ultra Grain E1 表面纹理 3"></figure>
                <figure class="slide swiper-slide"><img src="images/e1-04.svg" alt="Ultra Grain E1 表面纹理 4"></figure>
            </template>

            <template data-texture="e2">
                <figure class="slide swiper-slide"><img src="images/e2-01.svg" alt="Ultra Grain E2 表面纹理 1"></figure>
                <figure class="slide swiper-slide"><img src="images/e2-02.svg" alt="Ultra Grain E2 表面纹理 2"></figure>
                <figure class="slide swiper-slide"><img src="images/e2-03.svg" alt="Ultra Grain E2 表面纹理 3"></figure>
                <figure class="slide swiper-slide"><img src="images/e2-04.svg" alt="Ultra Grain E2 表面纹理 4"></figure>
            </template>

        </div>

    </div>
</section>

<script src="vendor/swiper/swiper-bundle.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
