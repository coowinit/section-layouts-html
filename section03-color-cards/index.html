<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Section 03 - 3D木纹色卡</title>
  <link rel="stylesheet" href="vendor/swiper/swiper-bundle.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<section id="section03">
  <div class="inner">
    <div class="content">
      <div class="intro">
        <p class="eyebrow">新天地花园地板</p>
        <h2 class="title">3D木纹<span>色卡</span></h2>
        <p class="desc">多达12种颜色可供选择，适合各种户外装饰风格，耐变色，能很好地保持自然质地。</p>

        <p class="current">颜色：<strong data-color-name aria-live="polite">柚木棕</strong></p>

        <div class="swatches" role="list" aria-label="木纹颜色选择">
          <button class="swatch is-active" type="button" data-index="0" data-name="柚木棕" aria-label="选择柚木棕" aria-pressed="true">
            <img src="images/swatch-01.svg" alt="">
          </button>
          <button class="swatch" type="button" data-index="1" data-name="雪松泥" aria-label="选择雪松泥" aria-pressed="false">
            <img src="images/swatch-02.svg" alt="">
          </button>
          <button class="swatch" type="button" data-index="2" data-name="银灰" aria-label="选择银灰" aria-pressed="false">
            <img src="images/swatch-03.svg" alt="">
          </button>
          <button class="swatch" type="button" data-index="3" data-name="赤陶棕" aria-label="选择赤陶棕" aria-pressed="false">
            <img src="images/swatch-04.svg" alt="">
          </button>
          <button class="swatch" type="button" data-index="4" data-name="浅橡木" aria-label="选择浅橡木" aria-pressed="false">
            <img src="images/swatch-05.svg" alt="">
          </button>
          <button class="swatch" type="button" data-index="5" data-name="深胡桃" aria-label="选择深胡桃" aria-pressed="false">
            <img src="images/swatch-06.svg" alt="">
          </button>
        </div>

        <a class="more" href="#">更多颜色</a>
      </div>

      <div class="viewer swiper" aria-label="木纹颜色场景预览">
        <div class="swiper-wrapper">
          <figure class="slide swiper-slide is-active" data-index="0" data-name="柚木棕">
            <img src="images/scene-01.svg" alt="柚木棕户外地板场景">
          </figure>
          <figure class="slide swiper-slide" data-index="1" data-name="雪松泥">
            <img src="images/scene-02.svg" alt="雪松泥户外地板场景">
          </figure>
          <figure class="slide swiper-slide" data-index="2" data-name="银灰">
            <img src="images/scene-03.svg" alt="银灰户外地板场景">
          </figure>
          <figure class="slide swiper-slide" data-index="3" data-name="赤陶棕">
            <img src="images/scene-04.svg" alt="赤陶棕户外地板场景">
          </figure>
          <figure class="slide swiper-slide" data-index="4" data-name="浅橡木">
            <img src="images/scene-05.svg" alt="浅橡木户外地板场景">
          </figure>
          <figure class="slide swiper-slide" data-index="5" data-name="深胡桃">
            <img src="images/scene-06.svg" alt="深胡桃户外地板场景">
          </figure>
        </div>

        <div class="swiper-pagination"></div>
      </div>
    </div>
  </div>
</section>

<script src="vendor/swiper/swiper-bundle.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
